<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tariff Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      max-width: 500px;
    }
    label, select, input {
      display: block;
      margin-top: 15px;
    }
    button {
      margin-top: 20px;
      padding: 10px;
      font-size: 16px;
    }
    .result {
      margin-top: 25px;
      padding: 15px;
      background-color: #f0f0f0;
      border-left: 5px solid #333;
    }
  </style>
</head>
<body>

  <h1>Tariff Calculator</h1>

  <label for="country">Country of Origin:</label>
  <select id="country">
    <option value="China">China</option>
    <option value="Mexico">Mexico</option>
  </select>

  <label for="value">Product Value (USD):</label>
  <input type="number" id="value" placeholder="e.g. 1000">

  <label for="rate">Tariff Rate (%):</label>
  <input type="number" id="rate" placeholder="Leave blank to use default">

  <button onclick="calculateTariff()">Calculate</button>

  <div class="result" id="output" style="display:none;"></div>

  <script>
    function calculateTariff() {
      const country = document.getElementById("country").value;
      const value = parseFloat(document.getElementById("value").value);
      let rateInput = document.getElementById("rate").value;
      let rate;

      if (!value || value < 0) {
        alert("Please enter a valid product value.");
        return;
      }

      if (rateInput === "") {
        // Default tariff rates
        if (country === "China") rate = 25;
        if (country === "Mexico") rate = 0;
      } else {
        rate = parseFloat(rateInput);
        if (isNaN(rate) || rate < 0) {
          alert("Please enter a valid tariff rate.");
          return;
        }
      }

      const tariffAmount = value * (rate / 100);
      const totalCost = value + tariffAmount;

      const output = document.getElementById("output");
      output.style.display = "block";
      output.innerHTML = `
        <strong>Results:</strong><br>
        Country: ${country}<br>
        Product Value: $${value.toFixed(2)}<br>
        Tariff Rate: ${rate}%<br>
        Tariff Amount: $${tariffAmount.toFixed(2)}<br>
        <strong>Total Landed Cost: $${totalCost.toFixed(2)}</strong>
      `;
    }
  </script>

</body>
</html>
